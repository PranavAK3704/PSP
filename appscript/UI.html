<!--
  UI.html — the agent queue.

  Master-detail, because the previous flat list was unreadable: you could not tell what needed a
  human from what was simply waiting. Four groups in a fixed order, and NEEDS A CATEGORY is
  first because NOVEL is the classifier refusing to guess — nothing else can happen to those
  tickets until somebody names them.

  The listening-channels panel is at the top and not hidden behind a tab, because "is it even
  listening" is the first question anyone asks and the answer used to require opening the sheet.
-->
<style>
  :root {
    --bg:#fbfbfa; --panel:#fff; --line:#e6e4e1; --ink:#1a1a1a; --muted:#77736d;
    --accent:#1a1a1a; --warn:#b4530a; --warnbg:#fdf3e7; --ok:#2d6a4f; --okbg:#eaf4ee;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 20px; }
  h1 { font-size:16px; margin:0 0 10px; letter-spacing:-.01em; }

  .health { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:4px 10px; border-radius:99px; border:1px solid var(--line);
          background:#fafafa; color:var(--muted); }
  .chip.ok   { background:var(--okbg);   color:var(--ok);   border-color:#c8e2d3; }
  .chip.bad  { background:var(--warnbg); color:var(--warn); border-color:#f0d9bd; }

  details.channels { margin-top:10px; }
  details.channels summary { cursor:pointer; font-size:12px; color:var(--muted); }
  table.ch { border-collapse:collapse; margin-top:8px; font-size:12px; width:100%; }
  table.ch th, table.ch td { text-align:left; padding:5px 12px 5px 0; border-bottom:1px solid var(--line); }
  table.ch th { color:var(--muted); font-weight:500; }
  td.err { color:var(--warn); }

  .wrap { display:grid; grid-template-columns:minmax(300px,380px) 1fr; gap:0;
          height:calc(100vh - 118px); }
  .list { overflow-y:auto; border-right:1px solid var(--line); background:var(--panel); }
  .detail { overflow-y:auto; padding:24px 28px; }

  .grouphead { position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line);
               padding:9px 16px; font-size:11px; font-weight:700; letter-spacing:.07em;
               text-transform:uppercase; color:var(--muted); z-index:1; }
  .grouphead.urgent { color:var(--warn); background:var(--warnbg); }
  .grouphead .n { float:right; font-weight:600; }

  .item { padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover { background:#f7f6f4; }
  .item.sel { background:#f0efec; box-shadow:inset 3px 0 0 var(--accent); }
  .item .t { font-weight:600; margin-bottom:3px; }
  .item .m { font-size:12px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; }
  .pill { font-size:11px; background:#efeeeb; border-radius:4px; padding:1px 6px; }
  .pill.rep { background:#fdf3e7; color:var(--warn); font-weight:600; }

  .detail h2 { font-size:19px; margin:0 0 4px; line-height:1.35; }
  .ref { font:600 11px ui-monospace,SFMono-Regular,monospace; letter-spacing:.08em; color:var(--muted); }
  .desc { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:14px 16px; margin:16px 0; font-size:13px; }
  dl.meta { display:grid; grid-template-columns:auto 1fr; gap:6px 20px; margin:18px 0; font-size:13px; }
  dl.meta dt { color:var(--muted); } dl.meta dd { margin:0; }

  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 10px; }
  button { font:inherit; font-size:13px; padding:7px 14px; border-radius:6px;
           border:1px solid var(--line); background:var(--panel); cursor:pointer; }
  button:hover { background:#f3f2f0; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  textarea, select, input[type=text] { font:inherit; font-size:13px; width:100%; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:var(--panel); }
  textarea { min-height:74px; resize:vertical; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:14px 0 5px; }

  .novel { background:var(--warnbg); border:1px solid #f0d9bd; border-radius:8px;
           padding:14px 16px; margin:18px 0; }
  .novel h3 { margin:0 0 4px; font-size:13px; color:var(--warn); }
  .novel p { margin:0 0 10px; font-size:12px; color:var(--muted); }
  .row { display:flex; gap:8px; }
  .flags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .flag { font:11px ui-monospace,monospace; background:var(--warnbg); color:var(--warn);
          border-radius:4px; padding:2px 7px; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  a { color:inherit; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
           background:var(--accent); color:#fff; padding:9px 18px; border-radius:99px;
           font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>

<header>
  <h1>Partner Intake</h1>
  <div class="health" id="health"><span class="chip">loading…</span></div>
  <details class="channels">
    <summary>Listening channels</summary>
    <table class="ch" id="channels"></table>
  </details>
</header>

<div class="wrap">
  <div class="list" id="list"><div class="empty">loading…</div></div>
  <div class="detail" id="detail"><div class="empty">Select a ticket</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
  var DATA = null, SEL = null;
  var GROUPS = ['NEEDS A CATEGORY', 'Open', 'Being worked on', 'Resolved', 'Withheld'];
  var STATES = [['OPEN','Open'], ['WORKING','Being worked on'], ['RESOLVED','Resolved']];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show';
    setTimeout(function(){ t.className='toast'; }, 2200); }

  function load(){
    google.script.run.withSuccessHandler(function(d){ DATA=d; render(); })
      .withFailureHandler(function(e){
        document.getElementById('list').innerHTML =
          '<div class="empty">Could not load: '+esc(e.message)+'</div>'; })
      .getQueue();
  }

  function render(){
    // The standing three checks, in the header, so a broken pipeline is visible without
    // anybody running anything.
    document.getElementById('health').innerHTML = DATA.health.map(function(h){
      return '<span class="chip '+(h.ok?'ok':'bad')+'">'+esc(h.label)+' — '+esc(h.detail)+'</span>';
    }).join('');

    var ch = DATA.channels || [];
    document.getElementById('channels').innerHTML = ch.length
      ? '<tr><th>channel</th><th>last poll</th><th>new</th><th>total</th><th></th></tr>' +
        ch.map(function(c){ return '<tr><td>#'+esc(c.name||c.channel_id)+'</td><td>'+
          esc(c.last_poll)+'</td><td>'+esc(c.new_last_poll)+'</td><td>'+esc(c.total_seen)+
          '</td><td class="err">'+esc(c.last_error||'')+'</td></tr>'; }).join('')
      : '<tr><td>No channels configured — set the CHANNELS script property.</td></tr>';

    var by = {}; GROUPS.forEach(function(g){ by[g]=[]; });
    DATA.tickets.forEach(function(t){ (by[t.group] || by.Open).push(t); });

    var html = '';
    GROUPS.forEach(function(g){
      if (!by[g].length) return;
      html += '<div class="grouphead'+(g==='NEEDS A CATEGORY'?' urgent':'')+'">'+esc(g)+
              '<span class="n">'+by[g].length+'</span></div>';
      by[g].forEach(function(t){
        html += '<div class="item'+(SEL===t.key?' sel':'')+'" onclick="pick(\''+t.key+'\')">'+
          '<div class="t">'+esc(t.title)+'</div><div class="m">'+
          '<span class="ref">'+esc(t.ref)+'</span>'+
          (t.dc_code?'<span class="pill">'+esc(t.dc_code)+'</span>':'')+
          (t.occurrence_count>1?'<span class="pill rep">raised '+t.occurrence_count+'×</span>':'')+
          (t.flags.length?'<span class="pill">'+t.flags.length+' flag'+(t.flags.length>1?'s':'')+'</span>':'')+
          '<span>'+esc(t.raiser)+'</span></div></div>';
      });
    });
    document.getElementById('list').innerHTML = html ||
      '<div class="empty">No tickets yet.<br>Once the pipeline runs they appear here.</div>';
    if (SEL) detail(SEL);
  }

  function pick(k){ SEL=k; render(); }

  function detail(k){
    var t = DATA.tickets.filter(function(x){ return x.key===k; })[0];
    if (!t) return;
    var toks = Object.keys(t.tokens||{}).map(function(kind){
      return kind+' = '+(t.tokens[kind]||[]).map(function(r){return r.value;}).join(', '); });

    var h = '<div class="ref">'+esc(t.ref)+'</div><h2>'+esc(t.title)+'</h2>';
    if (t.suppressed_reason)
      h += '<div class="novel"><h3>Withheld</h3><p>'+esc(t.suppressed_reason)+'</p></div>';
    h += '<div class="desc">'+esc(t.description)+'</div>';

    h += '<dl class="meta">'+
      '<dt>Raised by</dt><dd>'+esc(t.raiser)+(t.raiser_email?' · '+esc(t.raiser_email):'')+'</dd>'+
      '<dt>Category</dt><dd>'+esc(t.intent||'—')+'</dd>'+
      '<dt>State</dt><dd>'+esc(t.state)+'</dd>'+
      '<dt>Replies</dt><dd>'+t.reply_count+
        (t.latency!=null?' · first response '+Math.round(t.latency/60)+' min':'')+'</dd>'+
      (t.occurrence_count>1?'<dt>Raised</dt><dd>'+t.occurrence_count+' times, last '+
        esc(t.last_raised_at)+'</dd>':'')+
      (t.duplicate_of?'<dt>Counted into</dt><dd>'+esc(t.duplicate_of)+'</dd>':'')+
      (toks.length?'<dt>Identifiers</dt><dd>'+esc(toks.join(' · '))+'</dd>':'')+
      '<dt>Acknowledged</dt><dd>'+(t.acknowledged_at?esc(t.acknowledged_at):
        (t.acknowledge_error?'<span style="color:var(--warn)">'+esc(t.acknowledge_error)+'</span>':'not yet'))+'</dd>'+
      (t.permalink?'<dt>Source</dt><dd><a href="'+esc(t.permalink)+'" target="_blank">open in Slack</a></dd>':'')+
      '</dl>';

    if (t.flags.length)
      h += '<div class="flags">'+t.flags.map(function(f){return '<span class="flag">'+esc(f)+'</span>';}).join('')+'</div>';

    // The creep loop's only piece of UI. Naming this writes a gold exemplar, and the next run
    // classifies against it.
    if (t.group === 'NEEDS A CATEGORY') {
      h += '<div class="novel"><h3>Needs a category</h3>'+
        '<p>The classifier would not guess. Name it and every similar message after this one is '+
        'categorised automatically.</p><div class="row">'+
        '<select id="disp"><option value="">— pick or type below —</option>'+
        (DATA.dispositions||[]).map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>';}).join('')+
        '</select><input type="text" id="dispNew" placeholder="or a new category">'+
        '<button onclick="nameIt(\''+t.key+'\')">Save</button></div></div>';
    }

    h += '<div class="actions">'+STATES.map(function(s){
      return '<button class="'+(t.state===s[0]?'on':'')+'" onclick="setState(\''+t.key+'\',\''+s[0]+'\')">'+
             esc(s[1])+'</button>'; }).join('')+'</div>';

    h += '<label class="f">Note — the partner can see this on their status page</label>'+
      '<textarea id="note">'+esc(t.agent_note)+'</textarea>'+
      '<div class="actions"><button onclick="saveNote(\''+t.key+'\',\''+esc(t.state)+'\')">Save note</button>'+
      (t.updated_by?'<span class="chip">last edited by '+esc(t.updated_by)+'</span>':'')+'</div>';

    document.getElementById('detail').innerHTML = h;
  }

  function busy(on){ Array.prototype.forEach.call(
    document.querySelectorAll('#detail button'), function(b){ b.disabled=on; }); }

  function setState(k, s){
    busy(true);
    google.script.run.withSuccessHandler(function(){ toast('Moved to '+s); load(); })
      .withFailureHandler(function(e){ busy(false); toast('Failed: '+e.message); })
      .setTicketState(k, s, null);
  }
  function saveNote(k, s){
    busy(true);
    var n = document.getElementById('note').value;
    google.script.run.withSuccessHandler(function(){ toast('Note saved'); load(); })
      .withFailureHandler(function(e){ busy(false); toast('Failed: '+e.message); })
      .setTicketState(k, s, n);
  }
  function nameIt(k){
    var d = document.getElementById('dispNew').value.trim() || document.getElementById('disp').value;
    if (!d) { toast('Pick or type a category first'); return; }
    busy(true);
    google.script.run.withSuccessHandler(function(r){ toast('Categorised as '+r.disposition); load(); })
      .withFailureHandler(function(e){ busy(false); toast('Failed: '+e.message); })
      .nameDisposition(k, d);
  }

  load();
  setInterval(load, 60000);   // the pipeline runs every 5 minutes; a minute is responsive enough
</script>
