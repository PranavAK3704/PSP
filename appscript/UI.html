<!--
  UI.html — the agent queue.

  ── THE DESIGN, AND WHAT IT PROMISES ──────────────────────────────────────────────────────────
  Warm paper, not black glass: ten hours of this should not feel like a terminal. Each colour
  makes exactly one promise and keeps it —

      clay   #C1552E   do this
      amber  #E0A93C   you decide
      green  #2F7A52   they were told
      red    #B3332B   nobody owns it
      blue   #2C5A77   chosen, and it stuck

  Fraunces for headings and counts (readable from a metre away), Public Sans for every sentence
  in either script, IBM Plex Mono for reference numbers ONLY — so a digit is never misread.
  Noto Sans Devanagari is loaded because partners write in Hindi and the fallback was ugly.

  ── HOW IT TALKS ──────────────────────────────────────────────────────────────────────────────
  Not "SEPARATION 4.2% · NEEDS 15%" but "the robot got it down to two and stopped". Agents are
  not ML engineers; a number they cannot act on is noise wearing a lab coat. Every internal term
  is translated at the edge, and DISPOSITIONS() in Config.gs is where the translation lives.

  ── FOUR BEHAVIOURS THAT LOOK LIKE STYLE AND ARE BUG FIXES ────────────────────────────────────
  Each shipped as a defect first. A redesign is exactly how they come back.
  1. Never re-render the detail pane while focus is inside it; unsent note text lives in a dirty
     buffer. A note typed over 60 seconds used to vanish mid-sentence.
  2. Every action paints locally first and rolls back with a reason. A button that waits on a
     Sheets round trip looks dead and gets clicked twice.
  3. Group, search and "mine" filter in the browser. Each was a 2-second round trip.
  4. Anything that reaches the server shows a loader — the bar at the top, and a spinner on the
     control that was pressed. Optimistic paint tells you what WILL happen; the loader tells you
     it has not finished yet. Both, or the screen lies in one direction or the other.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
  :root {
    --paper:#FAF6F0; --card:#FFFFFF; --ink:#221F1B; --muted:#6B6259; --faint:#8A8177;
    --line:#E6DED3; --line2:#EFE7DC;
    --clay:#C1552E; --clay-dark:#7F3115; --amber:#E0A93C; --green:#2F7A52; --green-dark:#1F5637;
    --red:#B3332B; --blue:#2C5A77;
    --amber-bg:#FDF3E0; --amber-line:#E0B266; --amber-ink:#7A4A06; --amber-ink2:#8A5606;
    --green-bg:#F2F7F3; --green-line:#C3DFCE; --green-chip:#E8F3EC;
    --red-bg:#FBF0EF; --red-line:#E8C4C0;
    --serif:Fraunces,Georgia,serif;
    --sans:'Public Sans','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); overflow:hidden;
         font:14px/1.6 var(--sans); }
  button,input,select,textarea { font-family:var(--sans); color:inherit; }
  ::selection { background:#F6DFC8; }
  ::-webkit-scrollbar { width:11px; }
  ::-webkit-scrollbar-thumb { background:#E0D6C8; border-radius:6px; border:3px solid var(--paper); }
  .mono { font-family:var(--mono); }

  /* ── the loader. Every server call raises it. ───────────────────────────────────────────── */
  #bar { position:fixed; top:0; left:0; height:3px; width:0; background:var(--clay); z-index:99;
         transition:width .25s ease, opacity .3s; opacity:0; border-radius:0 3px 3px 0; }
  #bar.on { opacity:1; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.35);
          border-top-color:#fff; border-radius:50%; animation:sp .65s linear infinite;
          vertical-align:-3px; }
  .spin.dark { border-color:rgba(34,31,27,.2); border-top-color:var(--ink); }
  @keyframes sp { to { transform:rotate(360deg); } }
  .skel { height:96px; border-radius:18px; background:linear-gradient(90deg,#F2ECE3,#F8F4EE,#F2ECE3);
          background-size:200% 100%; animation:sh 1.2s linear infinite; margin-bottom:10px; }
  @keyframes sh { to { background-position:-200% 0; } }

  /* ── chrome ─────────────────────────────────────────────────────────────────────────────── */
  .shell { display:flex; flex-direction:column; height:100vh; padding:20px 26px 0; gap:16px; }
  header { display:flex; align-items:center; gap:14px; flex:none; }
  .logo { width:42px; height:42px; border-radius:14px; background:var(--clay); color:#fff;
          display:flex; align-items:center; justify-content:center; font:700 19px var(--serif); flex:none; }
  .title { font:700 23px/1.2 var(--serif); letter-spacing:-.01em; }
  .sub { font-size:13px; color:var(--muted); }
  .grow { flex:1; }
  .pill { display:flex; align-items:center; gap:9px; padding:8px 16px; border-radius:999px;
          background:var(--card); border:1px solid var(--line); font-size:13.5px; white-space:nowrap; }
  .pill.good { background:var(--green-chip); border-color:var(--green-line); color:var(--green-dark);
               font-weight:600; }
  .pill.warn { background:var(--amber-bg); border-color:var(--amber-line); color:var(--amber-ink2);
               font-weight:600; }
  .avatar { width:34px; height:34px; border-radius:999px; background:#EFE4D6; color:#7F5A33;
            display:flex; align-items:center; justify-content:center;
            font:600 13px var(--mono); flex:none; }

  /* ── the four cards. They ARE the filter — no tab bar. ──────────────────────────────────── */
  .stats { display:flex; align-items:stretch; gap:10px; flex:none; }
  .stat { flex:1; padding:15px 19px; border-radius:18px; background:var(--card);
          border:1px solid var(--line); cursor:pointer; text-align:left; display:flex;
          flex-direction:column; gap:2px; transition:transform .08s, box-shadow .12s; }
  .stat:hover { transform:translateY(-1px); box-shadow:0 3px 10px rgba(34,31,27,.06); }
  .stat .top { display:flex; align-items:baseline; gap:10px; }
  .stat .n { font:700 30px/1 var(--serif); }
  .stat .lab { font-size:15px; font-weight:700; }
  .stat .note { font-size:12.5px; color:var(--muted); }
  .stat.need { background:var(--amber-bg); border:2px solid var(--amber-line); }
  .stat.need .n, .stat.need .lab { color:var(--amber-ink); }
  .stat.need .note { color:var(--amber-ink2); }
  .stat.done { background:var(--green-bg); border-color:var(--green-line); }
  .stat.done .n, .stat.done .lab { color:var(--green-dark); }
  .stat.done .note { color:var(--green); }
  .stat.on { box-shadow:0 0 0 2px var(--clay); }
  .arrow { align-self:center; color:#C4B7A6; font-size:18px; flex:none; }

  .panes { flex:1; display:flex; gap:26px; min-height:0; padding-bottom:20px; }
  .left { width:560px; flex:none; display:flex; flex-direction:column; gap:13px; min-height:0; }
  .lhead { display:flex; align-items:center; gap:12px; flex:none; }
  .lhead h2 { margin:0; font:700 19px var(--serif); }
  .search { width:250px; padding:9px 15px; border-radius:999px; border:1px solid var(--line);
            background:var(--card); font-size:13px; }
  .search:focus { outline:none; border-color:var(--clay); }
  /* A filter with no visible control is a trap: it was on, persisted, and silently hid every
     ticket while the count above said 2. Any filter that can empty the list must be on screen. */
  .toggle { padding:9px 15px; border-radius:999px; border:1px solid var(--line);
            background:var(--card); font-size:13px; font-weight:600; color:var(--muted);
            cursor:pointer; white-space:nowrap; }
  .toggle:hover { border-color:var(--clay); color:var(--ink); }
  .toggle.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .list { overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
  .right { flex:1; overflow-y:auto; min-width:0; padding-right:4px; }

  /* ── ticket cards ───────────────────────────────────────────────────────────────────────── */
  .tk { display:flex; border-radius:18px; overflow:hidden; background:var(--card);
        border:1px solid var(--line); cursor:pointer; text-align:left; width:100%; padding:0;
        transition:transform .08s; }
  .tk:hover { transform:translateY(-1px); }
  .tk.sel { border:2px solid var(--clay); box-shadow:0 2px 0 rgba(193,85,46,.12); }
  .tk .stripe { width:6px; flex:none; background:var(--line); }
  .tk.need .stripe { background:var(--amber); }
  .tk.unowned .stripe { background:var(--red); }
  .tk.mine .stripe { background:var(--blue); }
  .tk .in { flex:1; padding:15px 17px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .tk .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tk .t { font-size:15px; font-weight:600; line-height:1.4; }
  .tk .meta { font-size:12.5px; color:var(--muted); display:flex; gap:9px; flex-wrap:wrap; }
  .badge { padding:3px 9px; border-radius:7px; font-size:11.5px; font-weight:700; letter-spacing:.02em; }
  .badge.need { background:var(--amber-bg); color:var(--amber-ink2); }
  .badge.rep  { background:var(--red-bg); color:var(--red); }
  .badge.mine { background:#E9F0F5; color:var(--blue); }
  .badge.dc   { background:#F1ECE4; color:#6B5B44; font-family:var(--mono); font-weight:600; }
  .ref { font:600 11.5px var(--mono); color:var(--faint); }

  /* ── detail / decision ──────────────────────────────────────────────────────────────────── */
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px;
          padding:20px 24px; margin-bottom:14px; }
  .card.amber { background:var(--amber-bg); border:2px solid var(--amber-line); }
  .card.red { background:var(--red-bg); border-color:var(--red-line); }
  h3.sec { margin:0 0 4px; font:700 21px var(--serif); letter-spacing:-.01em; }
  .lead { font-size:14px; color:var(--muted); margin:0 0 16px; }
  .kicker { font-size:12.5px; font-weight:700; letter-spacing:.05em; color:var(--faint);
            text-transform:uppercase; margin-bottom:12px; }
  .quote { font-size:16.5px; line-height:1.65; }
  .said { font-size:12.5px; color:var(--muted); margin-top:9px; }

  .choice { display:flex; gap:13px; width:100%; text-align:left; padding:16px 18px; cursor:pointer;
            border-radius:14px; border:1px solid var(--line); background:var(--card);
            margin-bottom:10px; align-items:flex-start; }
  .choice:hover { border-color:var(--clay); }
  .choice .num { width:28px; height:28px; border-radius:9px; background:var(--clay); color:#fff;
                 font:700 14px var(--mono); display:flex; align-items:center; justify-content:center;
                 flex:none; }
  .choice .nm { font-size:16px; font-weight:700; }
  .choice .why { font-size:13px; color:var(--muted); margin-top:3px; }
  .choice .to { font-size:12.5px; color:var(--blue); font-weight:600; margin-top:5px; }

  /* ── the timeline: what happened, and which step is stuck ───────────────────────────────── */
  .step { display:flex; gap:13px; padding:11px 0; border-bottom:1px solid var(--line2); }
  .step:last-child { border-bottom:0; }
  .step .dot { width:22px; height:22px; border-radius:999px; flex:none; margin-top:1px;
               display:flex; align-items:center; justify-content:center; font-size:12px;
               font-weight:700; color:#fff; }
  .step.done .dot  { background:var(--green); }
  .step.stuck .dot { background:var(--red); }
  .step.wait .dot  { background:#DCD3C6; color:var(--muted); }
  .step .h { font-size:14.5px; font-weight:600; }
  .step.stuck .h { color:var(--red); }
  .step .d { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .facts { display:grid; grid-template-columns:auto 1fr; gap:9px 20px; font-size:14px; }
  .facts dt { color:var(--muted); font-size:13px; }
  .facts dd { margin:0; font-weight:600; }

  .btns { display:flex; gap:9px; flex-wrap:wrap; }
  button.b { min-height:48px; padding:14px 20px; border-radius:13px; border:1px solid var(--line);
             background:var(--card); font-size:15.5px; font-weight:600; cursor:pointer;
             display:inline-flex; align-items:center; gap:9px; }
  button.b:hover:not(:disabled) { border-color:var(--clay); }
  button.b.primary { background:var(--clay); border-color:var(--clay); color:#fff; font-weight:700; }
  button.b.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  button.b:disabled { opacity:.55; cursor:default; }
  button.link { background:none; border:0; color:var(--clay-dark); font-size:14px; cursor:pointer;
                padding:6px 0; text-decoration:underline; text-underline-offset:3px; }
  select { min-height:44px; padding:10px 13px; border-radius:12px; border:1px solid var(--line);
           background:var(--card); font-size:14.5px; }
  textarea { width:100%; min-height:110px; padding:14px 16px; border-radius:14px;
             border:1px solid var(--line); background:var(--card); font-size:15px; line-height:1.6;
             resize:vertical; }
  textarea:focus, select:focus { outline:none; border-color:var(--clay); }
  label.f { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
            font-size:14px; font-weight:600; margin:0 0 7px; }
  .hint { font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .kbd { font:600 11.5px var(--mono); background:#F1ECE4; border-radius:5px; padding:2px 6px;
         color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(8px);
           background:var(--ink); color:#fff; padding:13px 22px; border-radius:13px;
           font-size:14.5px; font-weight:600; opacity:0; transition:all .2s; pointer-events:none;
           z-index:100; max-width:72vw; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad { background:var(--red); }
  .flags { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .flag { font-size:12px; background:var(--red-bg); color:var(--red); border-radius:7px;
          padding:3px 9px; }
</style>

<div id="bar"></div>
<div class="shell">
  <header>
    <div class="logo">☰</div>
    <div>
      <div class="title">Partner Intake</div>
      <div class="sub" id="shift"></div>
    </div>
    <div class="grow"></div>
    <span id="health"></span>
    <div class="pill" id="mePill" style="padding-left:6px"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panes">
    <div class="left">
      <div class="lhead">
        <h2 id="listTitle">Needs you first</h2>
        <span class="sub" id="listNote"></span>
        <div class="grow"></div>
        <button class="toggle" id="mineBtn" onclick="toggleMine()">Only mine</button>
        <input class="search" id="q" type="text" placeholder="Search a DC, a name, a number" oninput="onSearch()">
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="right" id="detail"><div class="empty">Pick a ticket on the left.</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  var DATA=null, TICKET=null, SEL=null;
  var VIEW={ group:'NEEDS A CATEGORY', mine:false, q:'' };
  var NOTES={};                 // key -> unsent note. The dirty buffer.
  var LOADING=false, BUSY=false, INFLIGHT=0;
  var ARCHIVE=['Resolved','Withheld'];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function toast(m,bad){ var t=document.getElementById('toast');
    t.textContent=m; t.className='toast show'+(bad?' bad':'');
    clearTimeout(t._h); t._h=setTimeout(function(){ t.className='toast'+(bad?' bad':''); },bad?5200:2400); }
  function shortName(e){ return String(e||'').split('@')[0]; }
  function initials(e){ var n=shortName(e).replace(/[._-]+/g,' ').trim().split(' ');
    return ((n[0]||'?')[0]+(n[1]||'')[0]||'').toUpperCase().slice(0,2); }

  /**
   * The loader. Raised on EVERY server call and lowered when the last one lands.
   * Optimistic paint says what WILL happen; this says it has not finished yet. Without both,
   * the screen lies in one direction or the other.
   */
  function loadStart(){
    INFLIGHT++;
    var b=document.getElementById('bar');
    b.className='on'; b.style.width='72%';
  }
  function loadEnd(){
    INFLIGHT=Math.max(0,INFLIGHT-1);
    if (INFLIGHT) return;
    var b=document.getElementById('bar');
    b.style.width='100%';
    setTimeout(function(){ b.className=''; setTimeout(function(){ b.style.width='0'; },300); },160);
  }
  /** Put a spinner INSIDE the control that was pressed, so it is obvious which one is working. */
  function press(el,label){
    if (!el) return function(){};
    var html=el.innerHTML, dis=el.disabled;
    el.disabled=true;
    el.innerHTML='<span class="spin'+(el.classList.contains('primary')||el.classList.contains('on')?'':' dark')+
                 '"></span>'+(label||'');
    return function(){ el.innerHTML=html; el.disabled=dis; };
  }
  /** One wrapper so no call site can forget the loader. */
  function call(fnName, args, onOk, onFail){
    loadStart();
    var r=google.script.run
      .withSuccessHandler(function(v){ loadEnd(); if(onOk) onOk(v); })
      .withFailureHandler(function(e){ loadEnd(); if(onFail) onFail(e); else toast(e.message,true); });
    r[fnName].apply(r,args||[]);
  }

  function ago(iso){
    if (!iso) return '';
    var t=Date.parse(String(iso)); if (isNaN(t)) return '';
    var m=Math.max(0,Math.round((Date.now()-t)/60000));
    if (m<60) return m+' min';
    if (m<1440) return Math.round(m/60)+' hours';
    var d=Math.round(m/1440); return d+(d===1?' day':' days');
  }
  function monthsBetween(a,b){ var x=Date.parse(a),y=Date.parse(b);
    return (isNaN(x)||isNaN(y))?0:Math.max(0,Math.round((y-x)/(30*86400000))); }
  function timeOf(iso){ var t=Date.parse(String(iso)); if(isNaN(t)) return '';
    return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

  // ── loading ────────────────────────────────────────────────────────────────────────────────
  function refresh(loud){
    call('getQueue',[VIEW],function(d){
      DATA=d; LOADING=false; renderAll(); if(loud) toast('Up to date');
    },function(e){
      LOADING=false;
      document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';
    });
  }
  function openTicket(key){
    SEL=key; TICKET=null; renderList();
    document.getElementById('detail').innerHTML=
      '<div class="empty"><span class="spin dark"></span><br><br>Opening…</div>';
    call('getTicket',[key],function(t){ TICKET=t; renderDetail(); },
      function(e){ document.getElementById('detail').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
  }

  /** Group, "mine" and search all filter HERE — each was a 2-second round trip. */
  function visible(){
    var q=(VIEW.q||'').toLowerCase();
    return (DATA.tickets||[]).filter(function(t){
      if (t.group!==VIEW.group) return false;
      if (VIEW.mine && (!DATA.me||t.assigned_to!==DATA.me.email)) return false;
      if (q){ var h=(t.title+' '+t.dc_code+' '+t.raiser+' '+t.ref+' '+(t.intent_label||'')).toLowerCase();
              if (h.indexOf(q)<0) return false; }
      return true;
    });
  }

  function renderAll(){ renderChrome(); renderList(); if (SEL && !TICKET) openTicket(SEL); }

  function renderChrome(){
    var me=DATA.me||{};
    document.getElementById('shift').textContent =
      new Date().toLocaleDateString([], {weekday:'long'})+' shift';
    document.getElementById('mePill').innerHTML =
      '<span class="avatar">'+esc(initials(me.email))+'</span>'+
      '<span><span style="font-weight:600;display:block;font-size:13.5px">'+esc(me.name||shortName(me.email))+'</span>'+
      '<span style="font-size:11.5px;color:var(--muted)">Partner Support</span></span>';

    document.getElementById('health').innerHTML=(DATA.health||[]).map(function(h){
      return '<span class="pill '+(h.ok?'good':'warn')+'" title="'+esc(h.detail)+'">'+
             (h.ok?'✓':'!')+' '+esc(friendlyHealth(h))+'</span>';
    }).join(' ');

    var c=DATA.counts||{};
    // Counted from the rows in hand, per group. The previous version put a whole-queue "mine"
    // total under a card showing 0, which read as a contradiction.
    function inGroup(g,pred){ return (DATA.tickets||[]).filter(function(t){
      return t.group===g && pred(t); }).length; }
    var meEmail = (DATA.me||{}).email;
    var nOpenFree = inGroup('Open', function(t){ return !t.assigned_to; });
    var nWorkMine = inGroup('Being worked on', function(t){ return t.assigned_to===meEmail; });
    var cards=[
      { g:'NEEDS A CATEGORY', n:c['NEEDS A CATEGORY']||0, lab:'Needs you',
        note:'One question each · आपका जवाब चाहिए', cls:'need' },
      { g:'Open', n:c['Open']||0, lab:'Waiting',
        note: nOpenFree ? nOpenFree+' nobody has picked up' : 'all picked up', cls:'' },
      { g:'Being worked on', n:c['Being worked on']||0, lab:'You are on it',
        note: nWorkMine ? nWorkMine+' of them are yours' : 'none of them are yours', cls:'' },
      { g:'Resolved', n:c['Resolved']||0, lab:'Finished',
        note:'Partner was told', cls:'done' }
    ];
    document.getElementById('stats').innerHTML = cards.map(function(k,i){
      return (i?'<span class="arrow">›</span>':'')+
        '<button class="stat '+k.cls+(VIEW.group===k.g?' on':'')+'" onclick="setGroup(\''+k.g+'\')">'+
        '<span class="top"><span class="n">'+k.n+'</span><span class="lab">'+esc(k.lab)+'</span></span>'+
        '<span class="note">'+esc(k.note)+'</span></button>';
    }).join('');

    document.getElementById('listTitle').textContent =
      VIEW.group==='NEEDS A CATEGORY' ? 'Needs you first' :
      VIEW.group==='Open' ? 'Waiting for someone' :
      VIEW.group==='Being worked on' ? 'Being worked on' :
      VIEW.group==='Resolved' ? 'Finished' : 'Not raised';
    var mb=document.getElementById('mineBtn');
    mb.className='toggle'+(VIEW.mine?' on':'');
    mb.textContent = VIEW.mine ? 'Only mine ✕' : 'Only mine';
    document.getElementById('listNote').textContent =
      visible().length + (VIEW.mine?' of yours':'') + (DATA.capped?' · showing the newest':'');
  }

  /** Health, said the way a person would say it. */
  function friendlyHealth(h){
    if (h.label==='PIPELINE') return 'Nothing is being sorted';
    if (h.label==='INTENT')  return h.ok?'Sorting works':'Sorting is off';
    if (h.label==='POLLING') return h.ok?'Listening':'Not listening';
    if (h.label==='ACK')     return h.ok?'Partners told':'Nobody told yet';
    return h.label;
  }

  function renderList(){
    var el=document.getElementById('list');
    if (LOADING){ el.innerHTML='<div class="skel"></div>'.repeat(5); return; }
    var ts=visible();
    if (!ts.length){
      // "Nothing here" is a lie when a filter is hiding things. Say what is hiding them and
      // give the way out — this exact screen once showed 2 in the count and an empty list.
      var inGroup=(DATA.tickets||[]).filter(function(t){ return t.group===VIEW.group; }).length;
      var why='', fix='';
      if (inGroup && VIEW.mine && VIEW.q){
        why=inGroup+' here, but none are yours and none match “'+esc(VIEW.q)+'”.';
        fix='<button class="link" onclick="clearFilters()">Show all '+inGroup+'</button>';
      } else if (inGroup && VIEW.mine){
        why=inGroup+' here, but none of them are assigned to you.';
        fix='<button class="link" onclick="toggleMine()">Show all '+inGroup+'</button>';
      } else if (inGroup && VIEW.q){
        why=inGroup+' here, but none match “'+esc(VIEW.q)+'”.';
        fix='<button class="link" onclick="clearFilters()">Clear the search</button>';
      } else {
        why = VIEW.group==='NEEDS A CATEGORY' ? 'Nothing needs you right now.' : 'Nothing here.';
      }
      el.innerHTML='<div class="empty">'+why+(fix?'<br><br>'+fix:'')+'</div>';
      return;
    }
    el.innerHTML=ts.map(function(t){
      var cls='tk'+(SEL===t.key?' sel':'')+
        (t.group==='NEEDS A CATEGORY'?' need':
          (DATA.me&&t.assigned_to===DATA.me.email?' mine':(!t.assigned_to?' unowned':'')));
      return '<button class="'+cls+'" onclick="openTicket(\''+t.key+'\')"><span class="stripe"></span>'+
        '<span class="in"><span class="row1">'+
        (t.group==='NEEDS A CATEGORY'?'<span class="badge need">NEEDS YOUR ANSWER</span>':'')+
        (t.occurrence_count>1?'<span class="badge rep">'+t.occurrence_count+' times</span>':'')+
        (t.dc_code?'<span class="badge dc">'+esc(t.dc_code)+'</span>':'')+
        (DATA.me&&t.assigned_to===DATA.me.email?'<span class="badge mine">Yours</span>':'')+
        '<span class="ref">'+esc(t.ref)+'</span></span>'+
        '<span class="t">'+esc(t.title)+'</span>'+
        '<span class="meta"><span>'+esc(t.raiser)+'</span>'+
        (t.intent_label?'<span>· '+esc(t.intent_label)+'</span>':'')+
        (!t.assigned_to&&t.group!=='Withheld'
          ? '<span style="color:var(--red);font-weight:600">· nobody has this, '+ago(t.last_raised_at)+'</span>'
          : '')+
        '</span></span></button>';
    }).join('');
  }

  // ── the decision screen ────────────────────────────────────────────────────────────────────
  function renderDecision(t){
    var idx=visible().findIndex(function(x){return x.key===t.key;});
    var total=visible().length;
    var ch=t.choices||[];
    var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+
      '<button class="link" onclick="SEL=null;TICKET=null;renderAll()">‹ Back to the queue</button>'+
      '<span class="grow"></span><span class="sub">Question '+(idx+1)+' of '+total+'</span>'+
      '<span class="ref">'+esc(t.ref)+'</span></div>';

    if (t.occurrence_count>1){
      var mo=monthsBetween(t.first_raised_at,t.last_raised_at);
      h+='<div class="card red"><div style="font-weight:700;font-size:15px;color:var(--red)">'+
         'Raised '+t.occurrence_count+' times'+(mo>0?' in '+mo+' month'+(mo>1?'s':''):'')+'</div>'+
         '<div class="hint" style="margin-top:4px">It is one old problem, not a new one.</div></div>';
    }

    h+='<div class="card"><div class="quote">“'+esc(firstLine(t.description))+'”</div>'+
       '<div class="said">'+esc(t.raiser)+(t.dc_code?' · DC '+esc(t.dc_code):'')+
       ' · these are their own words, nothing added</div></div>';

    h+='<div class="card amber"><h3 class="sec">Which of these two is it?</h3>'+
       '<p class="lead">The robot got it down to two and stopped. Pick one — that is the whole job here.</p>';
    if (ch.length){
      h+=ch.map(function(c,i){
        return '<button class="choice" id="ch'+i+'" onclick="pickChoice(this,\''+esc(c.key)+'\')">'+
          '<span class="num">'+(i+1)+'</span><span><span class="nm">'+esc(c.label)+'</span>'+
          (c.meaning?'<span class="why">'+esc(c.meaning)+'</span>':'')+
          (c.team?'<span class="to">Goes to '+esc(c.team)+'</span>':'')+'</span></button>';
      }).join('');
    } else {
      h+='<p class="lead">It could not get close to anything it knows. Pick from the full list.</p>';
    }
    h+='<div style="margin-top:6px"><button class="link" onclick="showAll()">Neither — show me the full list</button></div>'+
       '<div id="allWrap" style="display:none;margin-top:10px">'+
       '<div class="btns"><select id="disp"><option value="">Choose a category…</option>'+
       (DATA.dispositions||[]).map(function(d){
         return '<option value="'+esc(d.key)+'">'+esc(d.label)+'</option>'; }).join('')+
       '</select><button class="b primary" id="saveDisp" onclick="pickChoice(this,null)">Save it</button></div></div>'+
       '</div>';

    h+='<div class="hint">Press <span class="kbd">1</span> or <span class="kbd">2</span> to pick · '+
       '<span class="kbd">J</span> for the next one · Nothing here is scored against you.</div>';
    return h;
  }

  function firstLine(d){ return String(d||'').split('\n')[0] || '(no text — see the attachment)'; }
  function showAll(){ var w=document.getElementById('allWrap'); if(w) w.style.display='block'; }

  function pickChoice(btn,key){
    if (!TICKET||BUSY) return;
    var d=key || (document.getElementById('disp')||{}).value;
    if (!d){ toast('Pick a category first',true); return; }
    BUSY=true;
    var undo=press(btn,' Saving…');
    call('nameDisposition',[TICKET.key,d],function(r){
      BUSY=false;
      toast('Saved. You taught it — the next one sorts itself.');
      TICKET=null; SEL=null; refresh();
    },function(e){ BUSY=false; undo(); toast(e.message,true); });
  }

  // ── the ticket screen ──────────────────────────────────────────────────────────────────────
  function renderDetail(){
    if (!TICKET) return;
    var d=document.getElementById('detail');
    // Never rebuild the pane somebody is typing in.
    if (d.contains(document.activeElement) && document.activeElement.tagName==='TEXTAREA') return;
    var t=TICKET;
    if (t.group==='NEEDS A CATEGORY'){ d.innerHTML=renderDecision(t); return; }

    var noteVal = NOTES.hasOwnProperty(t.key) ? NOTES[t.key] : (t.agent_note||'');
    var dirty = NOTES.hasOwnProperty(t.key) && NOTES[t.key]!==(t.agent_note||'');
    var mine = DATA.me && t.assigned_to===DATA.me.email;

    var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+
      '<button class="link" onclick="SEL=null;TICKET=null;renderAll()">‹ Queue</button>'+
      '<span class="grow"></span><span class="ref">'+esc(t.ref)+'</span>'+
      (t.updated_by?'<span class="sub">last touched by '+esc(shortName(t.updated_by))+'</span>':'')+
      '</div>';

    if (t.occurrence_count>1){
      var mo=monthsBetween(t.first_raised_at,t.last_raised_at);
      h+='<div class="card red"><div style="font-weight:700;font-size:15.5px;color:var(--red)">'+
        'This has come up '+t.occurrence_count+' times'+(mo>0?' over '+mo+' month'+(mo>1?'s':''):'')+'</div>'+
        '<div class="hint" style="margin-top:4px">It is one old problem, not a new one. '+
        'Fixing the centre fixes all of them.</div></div>';
    }
    if (t.suppressed_reason)
      h+='<div class="card"><div class="kicker">Not raised</div><div class="hint" style="margin:0">'+
         esc(t.suppressed_reason)+'</div></div>';

    h+='<h3 class="sec" style="font-size:24px;margin-bottom:6px">'+esc(t.title)+'</h3>'+
       '<p class="lead">'+esc(t.raiser)+(t.dc_code?' · DC '+esc(t.dc_code):'')+
       (t.last_raised_at?' · '+esc(timeOf(t.last_raised_at)):'')+'</p>'+
       '<div class="card"><div class="quote">“'+esc(firstLine(t.description))+'”</div></div>';

    // ── what has happened so far ────────────────────────────────────────────────────────────
    var raiserName=shortName(t.raiser_email||t.raiser)||'the raiser';
    var centre = t.dc && t.dc.known ? t.dc.name : (t.dc ? 'The '+t.dc.code+' centre' : '');
    var steps=[];
    steps.push(t.acknowledged_at
      ? { s:'done', h:esc(t.raiser)+' was told we have it',
          d:'Automatic reply, '+timeOf(t.acknowledged_at) }
      : { s:'stuck', h:esc(t.raiser)+' has not been told yet',
          d: t.acknowledge_error ? esc(t.acknowledge_error) : 'The reply has not gone out.' });
    steps.push(t.assigned_to
      ? { s:'done', h:(mine?'You picked it up':esc(shortName(t.assigned_to))+' picked it up'),
          d:(t.assigned_at?timeOf(t.assigned_at)+' — ':'')+'nobody else can take it now' }
      : { s:'stuck', h:'Nobody has picked this up',
          d:'It has been waiting '+ago(t.last_raised_at)+'.' });
    if (t.dc){
      steps.push(t.dc_notified_at
        ? { s:'done', h:centre+' was told', d:'Sent '+timeOf(t.dc_notified_at) }
        : { s:'stuck', h:centre+' still has not been told',
            d: t.dc.known ? 'They are the ones who can fix it at the centre. This is the step that is stuck.'
                          : 'There is no contact on file for '+esc(t.dc.code)+', so nothing can reach them.' });
    }
    steps.push(t.filed_at
      ? { s:'done', h:'Filed into Kapture', d:'Sent '+timeOf(t.filed_at)+' — an agent has it there now' }
      : { s:'wait', h:'Not filed into Kapture yet',
          d: (t.kapture_blockers||[]).length ? esc(t.kapture_blockers.join('; '))
             : 'Send it when you are happy with the detail below.' });
    steps.push({ s: t.state==='RESOLVED'||t.state==='CLOSED' ? 'done':'wait',
      h: esc(t.raiser)+' hears it is fixed',
      d:'Happens on its own when you mark it done' });

    h+='<div class="card"><div class="kicker">What has happened so far</div>'+
      steps.map(function(s){
        return '<div class="step '+s.s+'"><span class="dot">'+
          (s.s==='done'?'✓':s.s==='stuck'?'!':'·')+'</span><span><span class="h">'+s.h+'</span>'+
          '<span class="d" style="display:block">'+s.d+'</span></span></div>';
      }).join('')+'</div>';

    // ── facts ───────────────────────────────────────────────────────────────────────────────
    h+='<div class="card"><dl class="facts">'+
      '<dt>Sorted as</dt><dd>'+esc(t.intent_info?t.intent_info.label:(t.intent||'—'))+
        (t.intent_info&&t.intent_info.team?' <span style="color:var(--muted);font-weight:400">· goes to '+esc(t.intent_info.team)+'</span>':'')+'</dd>'+
      (t.dc&&t.dc.known?'<dt>Centre contact</dt><dd>'+esc(t.dc.name)+
        (t.dc.mobile?' · <span class="mono">'+esc(t.dc.mobile)+'</span>':'')+'</dd>':'')+
      (t.latency!=null?'<dt>First reply took</dt><dd>'+Math.round(t.latency/60)+' minutes</dd>':'')+
      (t.reply_count?'<dt>Replies in Slack</dt><dd>'+t.reply_count+'</dd>':'')+
      (t.permalink?'<dt>Where it came from</dt><dd><a href="'+esc(t.permalink)+'" target="_blank" style="color:var(--clay-dark)">Open in Slack</a></dd>':'')+
      '</dl>'+
      ((t.flags||[]).length?'<div class="flags">'+t.flags.map(function(f){
        return '<span class="flag">'+esc(friendlyFlag(f))+'</span>'; }).join('')+'</div>':'')+
      '</div>';

    // ── actions ─────────────────────────────────────────────────────────────────────────────
    h+='<div class="card"><div class="kicker">Where is it now?</div><div class="btns">'+
      [['OPEN','Not started'],['WORKING','I am working on it'],
       ['RESOLVED','Sorted — tell '+esc(t.raiser).split(' ')[0]]].map(function(s){
        return '<button class="b'+(t.state===s[0]?' on':'')+'" onclick="setState(this,\''+s[0]+'\')">'+s[1]+'</button>';
      }).join('')+'</div>'+
      '<div class="hint">Saved the moment you tap. If the sheet says no, it comes back and tells you why.</div>'+
      (mine?'':'<div class="btns" style="margin-top:12px"><button class="b primary" onclick="claim(this)">Take this one</button></div>')+
      '</div>';

    h+=askPanel(t)+kapturePanel(t);

    h+='<div class="card"><label class="f"><span>Note for '+esc(t.raiser).split(' ')[0]+'</span>'+
      '<span id="noteState" style="font-weight:400;font-size:12.5px;color:'+
      (dirty?'var(--amber-ink2)':'var(--muted)')+'">'+(dirty?'not sent yet':'saved')+'</span></label>'+
      '<textarea id="note" oninput="noteChanged()" placeholder="Write in Hindi or English, whichever is easier">'+
      esc(noteVal)+'</textarea>'+
      '<div class="hint">They see this on their status page. Nothing is lost if you walk away mid-sentence.</div>'+
      '<div class="btns" style="margin-top:12px"><button class="b primary" onclick="saveNote(this)">Send this to '+
      esc(t.raiser).split(' ')[0]+'</button></div></div>';

    h+='<div class="card"><div class="kicker">Not yours to solve?</div>'+
      '<div class="btns"><select id="assignee" onchange="assign(this)">'+
      '<option value="">Hand it to someone else…</option>'+
      (DATA.roster||[]).map(function(a){
        return '<option value="'+esc(a.email)+'"'+(t.assigned_to===a.email?' selected':'')+'>'+
               esc(a.name)+'</option>'; }).join('')+'</select></div>'+
      '<div class="hint">Passing a ticket on is not a mark against you. An unowned ticket is.</div></div>';

    d.innerHTML=h;
  }

  /**
   * Ask the raiser for what is missing.
   *
   * The Slack app has no chat:write yet, so the agent copies this and sends it themselves.
   * Clumsy, works today, and exercises the whole loop — when the scope lands the only thing
   * that changes is who presses send.
   */
  function askPanel(t){
    if (!t.ask || t.answered_at) {
      if (!t.answer) return '';
      return '<div class="card"><div class="kicker">What they added when asked</div>'+
        '<div class="quote" style="font-size:14.5px">'+esc(t.answer)+'</div>'+
        (t.answer_identifiers?'<div class="hint" style="color:var(--green)">Picked out of that reply: '+esc(t.answer_identifiers)+'</div>':'')+
        '<div class="hint">Attached to the ticket and included when it is filed.</div></div>';
    }
    // Say WHICH half we are short on. "We did not understand it" is not useful; "we know where
    // but not what kind of problem" tells the agent whether to just fix the category themselves.
    var id=t.identification||{band:'blank',why:''};
    var head = id.band==='blank' ? 'We could not place this one'
             : id.who ? 'We know where, but not what kind of problem'
                      : 'We know the kind of problem, but not where';
    return '<div class="card amber"><h3 class="sec" style="font-size:18px">'+esc(head)+'</h3>'+
      '<p class="lead">'+esc(id.why)+'. Send this to '+esc(String(t.raiser).split(' ')[0])+
      ' and paste whatever comes back — or just fix it yourself above if you already know.</p>'+
      '<textarea id="askText" style="min-height:150px;font-size:14px">'+esc(t.ask.text)+'</textarea>'+
      '<div class="btns" style="margin-top:10px">'+
      '<button class="b primary" onclick="copyAsk(this)">Copy the message</button>'+
      '<button class="b" onclick="markAsked(this)">I sent it</button></div>'+
      '<div class="hint">Slack cannot send this for us yet \u2014 the app needs chat:write, which '+
      'is waiting on approval. Until then it is copy, paste, and paste the reply back.</div>'+
      (t.asked_at
        ? '<label class="f" style="margin-top:16px"><span>Their reply</span>'+
          '<span style="font-weight:400;color:var(--muted)">asked '+ago(t.asked_at)+' ago</span></label>'+
          '<textarea id="answerText" placeholder="Paste what they said"></textarea>'+
          '<div class="btns" style="margin-top:10px">'+
          '<button class="b primary" onclick="saveAnswer(this)">Attach it</button></div>'
        : '')+
      '</div>';
  }

  /** File it into the CRM the agents already work in. */
  function kapturePanel(t){
    if (t.filed_at){
      return '<div class="card"><div class="kicker">Filed</div>'+
        '<div style="font-size:14.5px">Sent to <span class="mono">'+esc(t.kapture_to)+'</span> at '+
        esc(timeOf(t.filed_at))+'</div>'+
        '<div class="hint">An agent has it in Kapture now. This record stays here \u2014 it is what '+
        'knows this problem has come up before.</div></div>';
    }
    var blockers=(t.kapture_blockers||[]);
    return '<div class="card"><div class="kicker">Send it to an agent</div>'+
      '<div style="font-size:14px;margin-bottom:10px">Files a formatted ticket to '+
      '<span class="mono">'+esc(t.kapture_to)+'</span>, where it lands with somebody in Kapture.</div>'+
      (blockers.length
        ? '<div class="hint" style="color:var(--red);margin-bottom:10px">Held back: '+
          esc(blockers.join('; '))+'</div>' : '')+
      (t.ask && !t.answer
        ? '<div class="hint" style="margin-bottom:10px">It will go with the missing details listed '+
          'as unanswered. Better to ask first if you can.</div>' : '')+
      '<div class="btns"><button class="b primary" onclick="fileIt(this,false)">Send to Kapture</button>'+
      '<button class="b" onclick="previewIt(this)">Show me the email first</button>'+
      (blockers.length?'<button class="b" onclick="fileIt(this,true)">Send anyway</button>':'')+
      '</div>'+
      '<pre id="kPreview" style="display:none;white-space:pre-wrap;background:var(--paper);'+
      'border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;'+
      'font:12.5px/1.6 var(--mono);max-height:340px;overflow:auto"></pre></div>';
  }

  /** Internal flag names, said plainly. */
  function friendlyFlag(f){
    var s=String(f);
    if (s.indexOf('no_actionable_identifier')===0) return 'No ID to act on — no DC, phone or waybill';
    if (s.indexOf('missing_required_')===0) return 'Missing '+s.replace('missing_required_','').split('_for_')[0];
    if (s.indexOf('dc_code_not_in_registry')===0) return 'That DC code is not in the list: '+s.split(':')[1];
    if (s.indexOf('dc_code_denylisted')===0) return 'Not really a DC code: '+s.split(':')[1];
    if (s.indexOf('malformed_')===0) return 'Looks wrong: '+s.replace('malformed_','');
    if (s==='disposition_novel_needs_human') return 'Waiting for someone to categorise it';
    if (s==='replies_exist_but_no_qualifying_first_response') return 'Replies exist, but nobody has really answered';
    return s.replace(/_/g,' ');
  }

  // ── actions: paint locally, loader while it saves, roll back with a reason ─────────────────
  function setState(btn,s){
    if (!TICKET||BUSY) return;
    var was=TICKET.state; BUSY=true; TICKET.state=s;
    var undo=press(btn,' Saving…');
    call('setTicketState',[TICKET.key,s,null],function(){
      BUSY=false; toast(s==='RESOLVED'?'Done — they will be told':'Saved'); refresh(); renderDetail();
    },function(e){ BUSY=false; TICKET.state=was; undo(); toast(e.message,true); });
  }
  function claim(btn){
    if (!TICKET||BUSY||!DATA.me) return;
    var was=TICKET.assigned_to; BUSY=true; TICKET.assigned_to=DATA.me.email;
    var undo=press(btn,' Taking…');
    call('claimTicket',[TICKET.key],function(){
      BUSY=false; toast('It is yours'); refresh(); renderDetail();
    },function(e){ BUSY=false; TICKET.assigned_to=was; undo(); toast(e.message,true); });
  }
  function assign(sel){
    if (!TICKET||BUSY) return;
    var email=sel.value, was=TICKET.assigned_to;
    BUSY=true; TICKET.assigned_to=email; sel.disabled=true;
    call('setAssignee',[TICKET.key,email],function(){
      BUSY=false; sel.disabled=false;
      toast(email?'Handed to '+shortName(email):'Left unowned'); refresh();
    },function(e){ BUSY=false; sel.disabled=false; TICKET.assigned_to=was; renderDetail(); toast(e.message,true); });
  }
  function noteChanged(){
    if (!TICKET) return;
    NOTES[TICKET.key]=document.getElementById('note').value;
    var s=document.getElementById('noteState');
    if (s){ s.textContent='not sent yet'; s.style.color='var(--amber-ink2)'; }
  }
  function saveNote(btn){
    if (!TICKET) return;
    var v=document.getElementById('note').value;
    var undo=press(btn,' Sending…');
    call('saveNote',[TICKET.key,v],function(){
      TICKET.agent_note=v; delete NOTES[TICKET.key];
      var s=document.getElementById('noteState');
      if (s){ s.textContent='sent'; s.style.color='var(--green)'; }
      undo(); toast('Sent'); refresh();
    },function(e){ undo(); toast(e.message,true); });
  }

  function copyAsk(btn){
    var el=document.getElementById('askText');
    el.select(); el.setSelectionRange(0, 99999);
    var ok=false;
    try { ok=document.execCommand('copy'); } catch(e) { ok=false; }
    toast(ok?'Copied — paste it into Slack':'Select the text and copy it', !ok);
  }
  function markAsked(btn){
    if (!TICKET) return;
    var undo=press(btn,' Saving…');
    call('recordAsk',[TICKET.key],function(){ undo(); toast('Noted'); openTicket(TICKET.key); },
      function(e){ undo(); toast(e.message,true); });
  }
  function saveAnswer(btn){
    if (!TICKET) return;
    var v=document.getElementById('answerText').value;
    if (!v.trim()){ toast('Paste their reply first',true); return; }
    var undo=press(btn,' Attaching…');
    call('recordAnswer',[TICKET.key,v],function(){ undo(); toast('Attached'); openTicket(TICKET.key); },
      function(e){ undo(); toast(e.message,true); });
  }
  function fileIt(btn,force){
    if (!TICKET||BUSY) return;
    BUSY=true;
    var undo=press(btn,' Filing…');
    call('fileToKapture',[TICKET.key,!!force],function(r){
      BUSY=false; toast(r.dry?'Dry run — nothing sent':'Filed to '+r.to); openTicket(TICKET.key); refresh();
    },function(e){ BUSY=false; undo(); toast(e.message,true); });
  }
  function previewIt(btn){
    if (!TICKET) return;
    var undo=press(btn,' Building…');
    call('previewKapture',[TICKET.key],function(txt){
      undo();
      var el=document.getElementById('kPreview');
      el.textContent=txt; el.style.display='block';
    },function(e){ undo(); toast(e.message,true); });
  }

  // ── view state ─────────────────────────────────────────────────────────────────────────────
  function setGroup(g){
    var wasA=ARCHIVE.indexOf(VIEW.group)>=0, isA=ARCHIVE.indexOf(g)>=0;
    VIEW.group=g; SEL=null; TICKET=null;
    document.getElementById('detail').innerHTML='<div class="empty">Pick a ticket on the left.</div>';
    renderChrome(); renderList(); persist();
    if (isA||wasA){ LOADING=true; renderList(); refresh(); }
  }
  function toggleMine(){ VIEW.mine=!VIEW.mine; persist(); renderChrome(); renderList(); }
  function clearFilters(){
    VIEW.mine=false; VIEW.q='';
    document.getElementById('q').value='';
    persist(); renderChrome(); renderList();
  }
  var st=null;
  function onSearch(){
    VIEW.q=document.getElementById('q').value; renderChrome(); renderList();
    clearTimeout(st); st=setTimeout(persist,900);
  }
  function persist(){
    google.script.run.withFailureHandler(function(){}).saveAgentFilter(JSON.stringify(VIEW));
  }

  document.addEventListener('keydown', function(e){
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      if (e.key==='Escape') document.activeElement.blur();
      return;
    }
    var ts=DATA?visible():[], i=ts.findIndex(function(t){return t.key===SEL;});
    var deciding = TICKET && TICKET.group==='NEEDS A CATEGORY';
    if ((e.key==='1'||e.key==='2') && deciding){
      var b=document.getElementById('ch'+(e.key==='1'?0:1)); if(b) b.click(); return;
    }
    if (e.key==='j'||e.key==='J'){ if(ts.length) openTicket(ts[Math.min(ts.length-1,i+1)].key); e.preventDefault(); }
    else if (e.key==='k'||e.key==='K'){ if(ts.length) openTicket(ts[Math.max(0,i-1)].key); e.preventDefault(); }
    else if (e.key==='/'){ document.getElementById('q').focus(); e.preventDefault(); }
    else if (e.key==='m') toggleMine();
    else if (e.key==='r') refresh(true);
  });

  window.addEventListener('beforeunload', function(e){
    if (Object.keys(NOTES).length){ e.preventDefault(); e.returnValue=''; }
  });

  LOADING=true; renderList();
  call('getQueue',[VIEW],function(d){
    DATA=d; LOADING=false;
    if (d.me&&d.me.filter){ try{ VIEW=JSON.parse(d.me.filter)||VIEW; }catch(err){} }
    document.getElementById('q').value=VIEW.q||'';
    renderAll();
    setInterval(function(){ if(!BUSY&&!INFLIGHT) refresh(); },45000);
  },function(e){
    LOADING=false;
    document.getElementById('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>';
  });
</script>
