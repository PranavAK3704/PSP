<!doctype html>
<meta charset="utf-8">
<title>Valmo Intake — live</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#1b212a; --line:#252c37;
    --ink:#e6edf3; --dim:#8b98a9; --faint:#5b6675;
    --green:#3fb950; --green-bg:#0f2417; --amber:#d29922; --amber-bg:#231a08;
    --blue:#58a6ff; --blue-bg:#0d1f33; --red:#f85149; --violet:#a371f7;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  code,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}

  header{
    position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid var(--line); padding:14px 22px;
  }
  .top{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  h1{font-size:16px; margin:0; font-weight:650; letter-spacing:-.01em}
  .chan{color:var(--dim); font-size:13px}
  .live{
    display:inline-flex; align-items:center; gap:7px; margin-left:auto;
    font-size:12px; color:var(--dim);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
       box-shadow:0 0 0 0 rgba(63,185,80,.7); animation:pulse 2s infinite}
  .dot.err{background:var(--red); animation:none}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .ro{border:1px solid var(--line); border-radius:999px; padding:2px 10px;
      font-size:11px; color:var(--faint)}

  .tiles{display:flex; gap:9px; margin-top:13px; flex-wrap:wrap}
  .tile{
    background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:9px 14px; min-width:96px;
  }
  .tile .n{font-size:22px; font-weight:640; line-height:1.15; font-variant-numeric:tabular-nums}
  .tile .l{font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
  .tile.good .n{color:var(--green)} .tile.warn .n{color:var(--amber)}
  .tile.info .n{color:var(--blue)}

  main{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:18px; padding:18px 22px 60px}
  @media (max-width:1100px){main{grid-template-columns:1fr}}
  h2{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
     margin:0 0 10px; font-weight:600}

  .card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:9px; padding:11px 14px; margin-bottom:9px;
  }
  .card.new{animation:flash 1.6s ease-out}
  @keyframes flash{0%{border-left-color:var(--blue); background:#132133}100%{}}
  .card.gated{opacity:.5; padding:8px 14px}
  .card.info{border-left-color:var(--amber)}
  .card.ticket{border-left-color:var(--green)}
  .card.reply{margin-left:26px; border-left-color:var(--faint)}

  .meta{display:flex; gap:9px; align-items:baseline; font-size:12px; color:var(--dim)}
  .meta .who{color:var(--ink); font-weight:600}
  .meta a{color:var(--faint); text-decoration:none; margin-left:auto; font-size:11px}
  .meta a:hover{color:var(--blue)}
  .txt{margin:6px 0 9px; white-space:pre-wrap; word-break:break-word}
  .txt.empty{color:var(--faint); font-style:italic}

  .chips{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:7px}
  .chip{
    font-size:11px; padding:2px 8px; border-radius:5px; border:1px solid transparent;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .chip.dc{background:var(--blue-bg); color:var(--blue); border-color:#1f4b7a}
  .chip.ent{background:#1a2030; color:#9db4d0; border-color:#2b3446}
  .chip.file{background:#241a30; color:var(--violet); border-color:#3d2b57}
  .chip.rx{background:#2a2410; color:var(--amber); border-color:#4a3d16}

  .row{font-size:12px; color:var(--dim); display:flex; gap:7px; align-items:center;
       padding:3px 0}
  .row b{color:var(--ink); font-weight:600}
  .tag{font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;
       padding:2px 7px; border-radius:4px}
  .tag.g{background:#20262f; color:var(--faint)}
  .tag.i{background:var(--amber-bg); color:var(--amber)}
  .tag.t{background:var(--green-bg); color:var(--green)}
  .tag.h{background:var(--amber-bg); color:var(--amber)}
  .tag.b{background:#3a2a08; color:#f0b429}

  .tk{background:var(--panel); border:1px solid var(--line); border-radius:8px;
      padding:10px 12px; margin-bottom:8px; border-left:3px solid var(--green)}
  .tk.held{border-left-color:var(--amber); opacity:.85}
  .tk .t{font-size:13px; font-weight:600; margin-bottom:3px}
  .tk .s{font-size:11.5px; color:var(--dim)}
  .nv{background:var(--panel); border:1px solid var(--line); border-radius:8px;
      padding:10px 12px; margin-bottom:8px; border-left:3px solid var(--violet)}
  .nv.done{border-left-color:var(--green); opacity:.7}
  .nv .q{font-size:13px; line-height:1.45; margin:2px 0 8px; white-space:pre-wrap;
         word-break:break-word}
  .nv .ctl{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .nv select, .nv input{background:var(--panel2); color:var(--ink);
      border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit;
      font-size:12px; max-width:190px}
  .nv button{background:var(--blue-bg); color:var(--blue); border:1px solid #1f4b7a;
      border-radius:6px; padding:5px 11px; font:inherit; font-size:12px; cursor:pointer}
  .nv button:hover{background:#12294a}
  .nv button.no{background:#20262f; color:var(--dim); border-color:var(--line)}
  .nv button.no:hover{color:var(--ink)}
  .nv .done-note{font-size:11.5px; color:var(--green)}
  .nv .err{font-size:11.5px; color:var(--red); margin-top:6px}
  .who-in{background:var(--panel2); color:var(--ink); border:1px solid var(--line);
      border-radius:6px; padding:3px 7px; font:inherit; font-size:11.5px; width:110px}
  .empty-note{color:var(--faint); font-size:13px; padding:18px; text-align:center;
              border:1px dashed var(--line); border-radius:9px}
  .toggle{font-size:11.5px; color:var(--dim); display:flex; align-items:center; gap:6px;
          cursor:pointer; user-select:none}
</style>

<header>
  <div class="top">
    <h1>Valmo Intake</h1>
    <span class="chan" id="chan">—</span>
    <span class="ro">read-only · no write scope</span>
    <span class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
    <label class="toggle"><input type="checkbox" id="redact"> mask PII</label>
    <label class="toggle">you: <input class="who-in" id="who" placeholder="your name"></label>
  </div>
  <div class="tiles" id="tiles"></div>
</header>

<main>
  <section>
    <h2>Live feed — newest first</h2>
    <div id="feed"><div class="empty-note">waiting for the first poll…</div></div>
  </section>
  <aside>
    <h2>Needs a human — the matcher refused to guess</h2>
    <div id="novel"></div>
    <h2 style="margin-top:22px">Tickets</h2>
    <div id="tickets"></div>
  </aside>
</main>

<script>
const seen = new Set();
let first = true;

const esc = s => (s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mask = s => (s??"")
  .replace(/(?<![A-Za-z0-9])([6-9]\d{9})(?![A-Za-z0-9])/g, (m)=> "•".repeat(6)+m.slice(-4))
  .replace(/([A-Za-z0-9._%+-]+)@([A-Za-z0-9.-]+)/g, (m,a,b)=> a[0]+"***@"+b);

function tiles(s){
  const T = [["messages",s.messages,""],["gated",s.gated,""],
             ["not an issue",s.not_an_issue,""],["orphans",s.orphans,"warn"],
             ["informational",s.informational,"warn"],
             ["issues",s.issues,"info"],["tickets to raise",s.tickets,"good"],
             ["held back",s.held_back,"warn"],["repeat issues",s.repeat_issues,"warn"],
             ["novel",s.novel,"info"],["awaiting a human",s.novel_pending,"warn"],
             ["confirmed",s.confirmations,"good"],["identifiers",s.entities,"info"]];
  return T.map(([l,n,c])=>`<div class="tile ${c}"><div class="n">${n??0}</div><div class="l">${l}</div></div>`).join("");
}

function card(m, R){
  const isNew = !first && !seen.has(m.message_id);
  seen.add(m.message_id);
  const body = R ? mask(m.text) : m.text;

  if (m.gated) return `<div class="card gated ${isNew?"new":""}">
      <div class="row"><span class="tag g">gated</span>
      <code>${esc(m.gate_rule||"")}</code>
      <span style="color:var(--faint)">${esc((body||"").slice(0,70))}</span></div></div>`;

  if (m.evidence === "not_an_issue") return `<div class="card gated ${isNew?"new":""}">
      <div class="row"><span class="tag g">not an issue</span>
      <span style="color:var(--faint)">${esc((body||"").slice(0,60))}</span>
      <code style="margin-left:auto">score ${m.evidence_score ?? 0}</code></div>
      <div class="row" style="padding-left:2px"><code style="color:var(--faint);font-size:11px">${esc(m.evidence_why||"")}</code></div></div>`;

  const cls = m.ticket && m.ticket.raise ? "ticket" : (m.informational ? "info" : "");
  let h = `<div class="card ${cls} ${m.is_reply?"reply":""} ${isNew?"new":""}">
    <div class="meta"><span class="who">${esc(m.author||"?")}</span><span>${esc(m.time||"")}</span>
      ${m.is_reply?'<span style="color:var(--faint)">↳ thread reply</span>':""}
      ${m.permalink?`<a href="${esc(m.permalink)}" target="_blank">slack ↗</a>`:""}</div>
    <div class="txt ${body?"":"empty"}">${body?esc(body):"(no text — content is in the attachment)"}</div>`;

  const chips = [];
  m.entities.forEach(e => chips.push(
    `<span class="chip ${e.kind==="dc_code"?"dc":"ent"}">${esc(e.kind)} ${esc(R?mask(e.value):e.value)}${e.tier?` ·${e.tier}`:""}</span>`));
  (m.files||[]).forEach(f => chips.push(`<span class="chip file">📎 ${esc(f||"file")}</span>`));
  (m.reactions||[]).forEach(r => chips.push(`<span class="chip rx">${esc(r)}</span>`));
  if (chips.length) h += `<div class="chips">${chips.join("")}</div>`;

  if (m.evidence === "orphan") h += `<div class="row"><span class="tag b">orphan</span>
      <span>no positive evidence — the context is in a message we never linked</span>
      <code style="color:var(--faint)">${esc(m.evidence_why||"")}</code></div>`;
  if (m.evidence === "weak") h += `<div class="row"><span class="tag h">weak</span>
      <span>kept for review</span><code style="color:var(--faint)">score ${m.evidence_score}</code></div>`;

  if (m.informational) h += `<div class="row"><span class="tag i">informational</span>
      <code>${esc(m.informational_rule||"")}</code>
      ${m.borderline?'<span class="tag b">borderline</span>':""}</div>`;

  if (m.issue_id) h += `<div class="row">issue <b class="mono">${esc(m.issue_short)}</b>
      via <code>${esc(m.grp_rule||"")}</code>
      <span style="color:var(--faint)">conf ${m.confidence ?? "—"}</span></div>`;
  else h += `<div class="row"><span style="color:var(--faint)">unassigned → stage 6</span></div>`;

  if (m.ticket) h += m.ticket.raise
    ? `<div class="row"><span class="tag t">would raise</span><b>${esc(m.ticket.title)}</b>
       <code style="color:var(--faint)">${esc(m.ticket.ref||"")}</code></div>`
    : `<div class="row"><span class="tag h">held back</span>
       <span>${esc((m.ticket.reason||"").split(" —")[0])}</span></div>`;

  return h + "</div>";
}

// ── The NOVEL queue ──────────────────────────────────────────────────────────────────────
// A refusal is a question. Answering it writes a gold exemplar, and the next message worded
// like this one is classified instead of asked about again.
let DISPOSITIONS = [];

const who = document.getElementById("who");
who.value = localStorage.getItem("intake_who") || "";
who.addEventListener("change", ()=> localStorage.setItem("intake_who", who.value.trim()));

// The page repaints every 2s. Repainting a panel someone is typing into would wipe what they
// typed, so the queue holds still while it has focus — and one render is skipped after a
// submit so the answer does not flicker before the next poll catches up.
function queueBusy(){
  const q = document.getElementById("novel");
  return q.contains(document.activeElement) &&
         ["SELECT","INPUT","BUTTON"].includes(document.activeElement.tagName);
}

function novelCard(it, R){
  const body = R ? mask(it.text) : it.text;
  if (it.confirmed){
    const c = it.confirmed;
    const what = c.decision === "not_an_issue" ? "not an issue" : esc(c.disposition);
    return `<div class="nv done">
      <div class="row"><span class="tag t">answered</span>
        <span>${esc(it.author||"")}</span><span>${esc(it.time||"")}</span></div>
      <div class="q">${esc((body||"").slice(0,220))}</div>
      <div class="done-note">${what} · ${esc(c.by||"")} · takes effect on the next index build</div>
    </div>`;
  }
  const opts = DISPOSITIONS.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("");
  return `<div class="nv" data-id="${esc(it.issue_id)}">
    <div class="row">
      ${(it.occurrences||1)>1?`<span class="tag h">raised ${it.occurrences}×</span>`:""}
      <span>${esc(it.author||"")}</span><span>${esc(it.time||"")}</span>
      ${it.permalink?`<a href="${esc(it.permalink)}" target="_blank"
         style="margin-left:auto;color:var(--faint);font-size:11px">open in Slack</a>`:""}
    </div>
    <div class="q">${esc((body||"").slice(0,220))}</div>
    <div class="ctl">
      <select class="pick">
        <option value="">— pick a class —</option>${opts}
        <option value="__new__">+ new class…</option>
      </select>
      <input class="newname" placeholder="new class name" style="display:none">
      <button class="yes">confirm</button>
      <button class="no">not an issue</button>
    </div>
    <div class="err" style="display:none"></div>
  </div>`;
}

async function send(el, payload){
  const err = el.querySelector(".err");
  el.querySelectorAll("button,select,input").forEach(b=>b.disabled = true);
  try {
    const r = await fetch("/api/confirm", {
      method: "POST",
      // Makes the request non-simple, so a cross-origin page cannot send it without a
      // preflight the server refuses. See do_POST.
      headers: {"Content-Type":"application/json", "X-Intake-Confirm":"1"},
      body: JSON.stringify(payload),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "refused");
    skipNext = true;
    el.classList.add("done");
    el.querySelector(".ctl").innerHTML =
      `<span class="done-note">recorded — runs scripts/build_exemplars.py to take effect</span>`;
  } catch(e){
    err.style.display = "";
    err.textContent = String(e.message||e);
    el.querySelectorAll("button,select,input").forEach(b=>b.disabled = false);
  }
}

document.getElementById("novel").addEventListener("change", (ev)=>{
  if (!ev.target.classList.contains("pick")) return;
  const el = ev.target.closest(".nv");
  el.querySelector(".newname").style.display = ev.target.value === "__new__" ? "" : "none";
});

document.getElementById("novel").addEventListener("click", async (ev)=>{
  const el = ev.target.closest(".nv");
  if (!el) return;
  const it = (LAST_QUEUE||[]).find(x=>x.issue_id === el.dataset.id);
  if (!it) return;
  const by = (who.value||"").trim();
  const fail = (m)=>{ const e = el.querySelector(".err"); e.style.display=""; e.textContent=m; };

  if (ev.target.classList.contains("no")){
    if (!by) return fail("put your name in the box at the top — an unattributed label cannot be questioned");
    return send(el, {text: it.text, decision: "not_an_issue", confirmed_by: by,
                     issue_id: it.issue_id, permalink: it.permalink});
  }
  if (ev.target.classList.contains("yes")){
    if (!by) return fail("put your name in the box at the top — an unattributed label cannot be questioned");
    const sel = el.querySelector(".pick").value;
    const disp = sel === "__new__" ? (el.querySelector(".newname").value||"").trim() : sel;
    if (!disp) return fail("pick a class, or name a new one");
    return send(el, {text: it.text, decision: "label", disposition: disp, confirmed_by: by,
                     issue_id: it.issue_id, permalink: it.permalink});
  }
});

let LAST_QUEUE = [], skipNext = false;

async function tick(){
  let d;
  try { d = await (await fetch("/api/state",{cache:"no-store"})).json(); }
  catch(e){ document.getElementById("status").textContent = "server unreachable";
            document.getElementById("dot").className = "dot err"; return; }

  const p = d.poll||{}, R = document.getElementById("redact").checked;
  document.getElementById("dot").className = "dot" + (p.status==="error"?" err":"");
  document.getElementById("status").textContent =
    p.status==="error" ? ("error: "+(p.error||"").slice(0,60))
                       : `live · poll #${p.count||0} · ${p.last_at||"—"}`;
  document.getElementById("chan").textContent = p.channel ? "#"+(p.channel_name||p.channel) : "";
  document.getElementById("tiles").innerHTML = tiles(d.stats||{});

  const feed = d.feed||[];
  document.getElementById("feed").innerHTML = feed.length
    ? feed.map(m=>card(m,R)).join("")
    : '<div class="empty-note">no messages yet — post something in the channel</div>';

  const tk = d.tickets||[];
  document.getElementById("tickets").innerHTML = tk.length ? tk.map(t=>`
    <div class="tk ${t.raise?"":"held"}">
      <div class="t">${esc(t.title||"")}</div>
      <div class="s">
        ${t.disposition?`<span class="chip ${t.disposition==="NOVEL"?"rx":"dc"}" style="margin-right:6px">${esc(t.disposition)}</span>`:""}
        ${(t.occurrences||1)>1
          ? `<span class="tag b" style="margin-right:6px">raised ${t.occurrences}×</span>`
          + `<span style="color:var(--dim)">${esc((t.first_raised||"").slice(0,10))} → ${esc((t.last_raised||"").slice(0,10))}</span><br>`
          : ""}
        ${t.raise
          ? `${esc(t.ref||"")} · ${t.replies||0} replies${t.latency!=null?` · first response ${Math.round(t.latency)}s`:""}`
          : "held back — "+esc((t.reason||"").split(" —")[0])}</div>
    </div>`).join("") : '<div class="empty-note">none yet</div>';

  DISPOSITIONS = d.dispositions || DISPOSITIONS;
  LAST_QUEUE = d.novel_queue || [];
  if (skipNext) { skipNext = false; }
  else if (!queueBusy()) {
    document.getElementById("novel").innerHTML = LAST_QUEUE.length
      ? LAST_QUEUE.map(it=>novelCard(it,R)).join("")
      : '<div class="empty-note">nothing unclassified — every issue matched a known class</div>';
  }

  first = false;
}
document.getElementById("redact").addEventListener("change", tick);
tick(); setInterval(tick, 2000);
</script>
