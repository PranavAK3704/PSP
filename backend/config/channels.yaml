# In-scope channels, one line of reason each. Read by stage 2 (`intake qualify`).
#
# THIS FILE IS A DECLARATION, NOT THE DECISION. The gate scores every channel present in the
# store and OVERRIDES an in_scope declaration when the identifier rate falls below the
# threshold. A hardcoded allowlist prevents one mistake once; the gate prevents it every time a
# channel is added, which is the actual risk — WhatsApp and #valmo-mm-am-escalations are next.
#
# Channel ids verified against the live workspace on 2026-09-08 (metadata only).

thresholds:
  # Substantive top-level messages carrying at least one identifier (DC code, Kapture id,
  # waybill, mobile, pilot id, email). firefighters measures ~56%; pilot_support_ams ~11%.
  identifier_rate: 0.30
  # How many top-level messages the sampled Claude estimate reads. Sampled, not exhaustive:
  # it is a sanity check on a channel, not a per-message label.
  sample_size: 30

channels:
  - id: C09JY7YLB3L
    name: valmo-firefighters
    in_scope: true
    reason: >-
      Hub and internal-ops escalations — captain panel login failures, pilot onboarding,
      payouts not reflecting, invoices not generating, app errors. ~56% of top-level messages
      carry an identifier. Public channel.

  - id: C08T6NLL77H
    name: valmo-lm-ams
    in_scope: true
    reason: >-
      Last-mile network escalations — DC closures, vehicles held, load not received, line-haul
      delays, RTO loss revocation, negative payouts. PRIVATE channel, so the export needs
      groups:history. 20-39% of top-level messages are weather callouts, flagged informational
      rather than ticketed.

  # ── TEST CHANNEL ───────────────────────────────────────────────────────────────────────────
  - id: C0C0KPAFVT4
    name: intake-test
    in_scope: true
    reason: >-
      Private sandbox for exercising the live read path end to end. Real Slack, real bot token,
      no production data. Kept in scope deliberately so a smoke test runs through the same gate
      as the real channels rather than around it. Remove when the real channels are wired.

  # ── EXCLUDED, AND THIS MUST STAY EXCLUDED ──────────────────────────────────────────────────
  - id: C0AKEL49PEF
    name: pilot_support_ams
    in_scope: false
    reason: >-
      NOT an escalation channel — it is the support team's OWN internal channel: sick-leave
      requests, daily Kapture closure summaries, product announcements. Only ~11% of top-level
      messages carry any identifier against ~56% in firefighters. Pointed at this, the pipeline
      would raise support tickets for people requesting a day off.

  - id: C07L4A02TC3
    name: valmo_dogfooding
    in_scope: false
    reason: >-
      3 records in the export, all channel_join. Nothing to ingest.

  # ── CANDIDATES FOUND IN THE WORKSPACE, NOT YET ASSESSED ────────────────────────────────────
  # Present in the Meesho workspace and plausibly in scope later. Undeclared channels are
  # excluded by default and the gate reports their numbers, so adding one is a deliberate act
  # with evidence rather than an edit nobody reviewed.
