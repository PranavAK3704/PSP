# Stage 5 — assign messages to issues. Deterministic, no model, no network.
#
# Strict priority, evaluated in this order:
#   1. thread_ref matches an existing issue's anchor  -> same issue   (confidence 1.0)
#   2. shares an entity token with an open issue inside the window -> same issue
#   3. otherwise                                      -> unassigned, handed to stage 6
#
# ── WHY dc_code IS NOT IN join_on BY DEFAULT ─────────────────────────────────────────────────
# The rule "shares an entity token with an open issue inside 7 days" is right for a token that
# identifies an INCIDENT and wrong for one that identifies a PLACE. A DC code is a place: one
# hub legitimately raises a login failure, a payout query and a vehicle held in the same week,
# and joining on the hub alone merges all three into one issue whose anchor is whichever came
# first. Every later message then attaches to the wrong problem.
#
# That is the failure the brief's own instruction guards against — "a wrong merge means the
# wrong DC gets the wrong answer; splitting is recoverable by a human, contamination isn't."
# So the default joins only on tokens that identify a specific thing: a ticket, a shipment, a
# person. `dc_code` can be enabled, and `evaluate` scores both settings so the cost of the
# choice is a measured number rather than an argument.

# Default window when a token kind has no entry in `windows` below.
window_days: 7

# ── PER-KIND WINDOWS: how long a shared token still means "the same issue" ───────────────────
# A single uniform window was wrong in both directions. The case this exists for is a hub that
# raised seven tickets over FIVE MONTHS for one unpaid field executive — under a 7-day window
# every one of those looks like a brand-new issue and the recurrence signal, which is the whole
# point, is destroyed.
#
# The right window depends on what the token IDENTIFIES:
#   a PERSON does not change      -> months
#   a SHIPMENT is resolved        -> days
#   a TICKET is a record          -> long, it IS the issue
#   a PLACE is not an incident    -> never join on it (see join_on_weak)
windows:
  kapture_id: 180     # a ticket number IS the issue; sharing one is near-proof
  mobile:     180     # a person. The seven-tickets-for-one-FE case lives here
  pilot_id:   180     # a person
  email:      180     # a person
  waybill:      14    # one shipment, resolved and done

join_on:
  # Tokens that identify ONE incident. Sharing one is strong evidence of the same issue.
  - kapture_id      # an existing ticket number — the strongest signal available
  - waybill         # one shipment
  - mobile          # one person
  - pilot_id        # one person
  - email

# What "weak" MEANS. Declared here so the vocabulary lives in config, but only USED when a
# caller passes join_weak=True (the CLI's --join-weak, and `evaluate`, which scores both).
# Default runs do not join on these.
join_on_weak:
  - dc_code

confidence:
  thread_ref: 1.0
  entity_join_strong: 0.75   # a unique identifier inside the window
  entity_join_weak: 0.35     # a place-shaped token; below the stage-6 threshold on purpose
  unassigned: 0.0

# Assignments at or below this confidence are handed to stage 6 for adjudication even though a
# rule did fire. Set to 0 to send nothing but true unassigned messages.
adjudicate_below: 0.50
