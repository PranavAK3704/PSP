# ─────────────────────────────────────────────────────────────────────────────
# Model strategy — the SINGLE place that decides which model runs each node.
#
# ACTIVE: provider is OpenAI (via the gateway), running gpt-5.5 on EVERY tier —
# i.e. fast == deep today. The fast/deep split exists so a tiered provider can be
# swapped in without any pipeline change; right now both tiers resolve to gpt-5.5.
#
# Claude and Gemini are swappable ALTERNATIVES: flip the `provider:` key below and
# the registry routes each node's tier to that provider's model ids — no pipeline
# code changes (see app/llm/registry.py). The Claude/Gemini tier ids are listed
# under `tiers:` as ready-to-use alternatives.
#
# ENV OVERRIDES (so a swap is a DEPLOY change, not a file edit — e.g. when an endpoint dies):
#   LLM_PROVIDER=openai   LLM_MODEL_FAST=<id>   LLM_MODEL_DEEP=<id>
#   + OPENAI_BASE_URL / OPENAI_API_KEY for ANY OpenAI-compatible endpoint. Examples:
#     Groq   OPENAI_BASE_URL=https://api.groq.com/openai/v1/chat/completions  LLM_MODEL_*=llama-3.3-70b-versatile
#     Ollama OPENAI_BASE_URL=http://localhost:11434/v1/chat/completions       LLM_MODEL_*=llama3.1
# ─────────────────────────────────────────────────────────────────────────────

provider: claude            # ACTIVE. openai | gemini | claude  <-- flip to switch provider

# Per-node model tier. Each pipeline node asks the registry for its tier.
# (With provider: openai both tiers map to gpt-5.5, so the split is a no-op today.)
nodes:
  intent:              fast   # extract intent + entities (high volume)
  classify:            fast   # locate disposition
  policy_reasoning:    deep   # money-touching judgement
  adversarial_verify:  deep   # independent skeptic before any money move
  explain:             fast   # warm, grounded reply
  monitor_compose:     fast   # compose a proactive nudge
  sop_compile:         deep   # plain SOP -> Executable Policy (authoring)

# ─── VERIFIER INDEPENDENCE ───────────────────────────────────────────────────
# Per-node PROVIDER override. Everything else runs on `provider:` above; these nodes are
# deliberately routed elsewhere.
#
# `adversarial_verify` is the skeptic that has to agree before a money decision stands. Left on
# the global provider it was the same vendor AND the same model (`deep` tier) as the rest of the
# pipeline — a second opinion in form only, since a verifier sharing the proposer's weights
# shares its blind spots. Routing it to Gemini makes the disagreement possible.
#
# Override at deploy time with LLM_PROVIDER_ADVERSARIAL_VERIFY (env wins over this file).
# Needs GEMINI_API_KEY; /api/health reports per-node key presence so a missing one is visible
# BEFORE the first money decision rather than as a fail-closed escalation.
# CURRENT VALUE IS `claude` because the GEMINI_API_KEY in backend/.env returns 401 on every
# auth mechanism (query ?key=, x-goog-api-key, Bearer) with "Expected OAuth 2 access token" —
# i.e. it is not a usable Gemini API key. Routing a FAIL-CLOSED verifier at a provider that
# 401s turns every money decision into an escalation that looks like the skeptic disagreeing,
# so the default stays on something that works.
#
# TO ACTIVATE REAL INDEPENDENCE: put a working key in GEMINI_API_KEY and change the line below
# to `gemini` (or set LLM_PROVIDER_ADVERSARIAL_VERIFY=gemini, which needs no file edit).
# /api/health.llm.verifier_independence reports which of the two is live, so this never claims
# an independence it does not have.
node_providers:
  adversarial_verify: claude

# Per-node model, PROVIDER-SCOPED — an unscoped id would follow the node across a vendor
# boundary if its provider degraded, giving `claude:gemini-2.5-pro`.
node_models:
  adversarial_verify:
    gemini: gemini-2.5-pro
    claude: claude-opus-5

# Tier -> concrete model id, per provider.
tiers:
  openai:                            # legacy demo path via the hackathon gateway — kept
                                     # as a fallback only; not a production target
    fast: gpt-5.5    # gpt-5.5 on EVERY tier — same model for fast and deep today
    deep: gpt-5.5    # money judgement + adversarial verify + SOP compile
  gemini:                            # alternative — flip `provider: gemini` above
    fast: gemini-2.5-flash
    deep: gemini-2.5-pro
  claude:                            # <-- ACTIVE provider
    fast: claude-sonnet-5             # conversational path — reasons well enough to be trusted
    deep: claude-opus-5               # money judgement + adversarial verify (strongest)

temperature: 0.1
