# Stage 3 — the noise gate and the informational classifier. Rules live here, not in code.
#
# ── GATED IS NOT DELETED ─────────────────────────────────────────────────────────────────────
# Every rule below MARKS a message. Nothing is removed from the store, because "what did the
# filter throw away" has to be answerable — and because a gate rule that is quietly wrong is
# indistinguishable from a gate rule that is right unless you can list what it caught.
#
# ── THE ONE HARD EXCEPTION ───────────────────────────────────────────────────────────────────
# An empty-text message that carries an attachment is NEVER gated, whatever the rules say.
# ~5% of lm-ams records are exactly this: the entire issue is a screenshot and the text is "".
# Without the exception an emptiness rule silently deletes real issues, and the report shows a
# healthy filtered count while the register is missing rows.
#
# ── VOLUME ───────────────────────────────────────────────────────────────────────────────────
# channel_join / channel_leave are 3-20% of a day depending on the day, NOT the 40% originally
# assumed. This gate is for acks and "thanks", not for volume.

subtypes:
  # Dropped on subtype alone. These carry no author intent at all.
  - channel_join
  - channel_leave

rules:
  # Matched against the message text, lowercased and stripped of Slack markup and punctuation.
  # `exact` matches the WHOLE remaining string — a bare ack. It deliberately does not match
  # "thanks, but the DC is still down", which is a real message that happens to start politely.
  - name: bare_ack
    # 'yes'/'no' MUST stay quoted: YAML 1.1 parses them as booleans, and an unquoted
    # `yes` reaches the gate as Python True — which then crashes on .lower(). The loader
    # coerces defensively too, but the quotes are the actual fix.
    exact: [ok, okk, okay, k, kk, done, noted, ack, acknowledged, sure, "yes", yeah,
            yep, "no", nope]
  - name: thanks
    exact: [thanks, thank you, thankyou, thx, ty, tysm, thanks a lot, many thanks, thanku]
  - name: combined_ack
    # Real acks are frequently two words. `exact` matches the WHOLE normalised string, so
    # "noted, thanks" is not covered by `noted` or `thanks` alone — it needs its own entry.
    # Found by running the gate over the fixtures and reading what it did NOT catch.
    # Vocatives (sir/bhai/team) are included because they are how these are actually written.
    exact: [noted thanks, thanks noted, ok thanks, okay thanks, thanks ok, ok done,
            done thanks, noted sir, ok sir, okay sir, thanks sir, thank you sir,
            noted bhai, ok bhai, thanks bhai, noted team, ok team, thanks team,
            sure thanks, ok noted, noted ok, will do, ok will do, done sir]
  - name: plus_one
    exact: ["+1", "1", "same", "same here", "same issue", "me too", "following", "watching"]
  - name: fyi_only
    exact: [fyi, fyi., pfa, pfb, noted fyi, for your information]
  - name: greeting
    exact: [hi, hii, hello, hey, gm, good morning, good afternoon, good evening, namaste]
  # ORDER MATTERS: rules are evaluated top-down and the first match wins, so mention_only is
  # listed BEFORE emoji_only. Both strip to an empty string, so a bare "<@U…>" ping was being
  # reported as emoji_only — which is a wrong answer to "what did the filter throw away".
  - name: mention_only
    # Text is nothing but <@U…> / <!channel> / <!subteam^…> markup.
    mention_only: true
  - name: emoji_only
    # Nothing left after markup and punctuation are stripped, but the raw text was non-empty.
    emoji_only: true

  - name: ack_phrase
    # GENERALISES the exact lists above. Fires when EVERY word of the normalised text is in the
    # vocabulary below AND the message is short. Measured on 155 adversarial messages: `exact`
    # matching caught 8 of 33 acks, because real ones are Hinglish and carry an emoji --
    # "haan bhai ho gaya thank you 🙏", "gm all 🙏", "noted sir all clear now 👍". Enumerating
    # every phrasing does not scale; requiring every word to be an ack word does.
    #
    # The word cap is what stops it over-reaching. "thanks but the DC is still down" survives
    # because `dc`, `still` and `down` are not ack words -- but the cap means even an unlucky
    # vocabulary hit cannot swallow a long message.
    max_words: 7
    all_words_in:
      [ok, okk, okay, oky, k, kk, done, noted, note, ack, sure, yes, yeah, yep, ya, haan,
       ji, han, thanks, thank, you, thankyou, thx, ty, tysm, thanku, shukriya, dhanyawad,
       sir, madam, maam, bhai, boss, team, all, guys, ho, gaya, gyi, hua, clear, now,
       great, good, gm, ga, ge, morning, afternoon, evening, night, hi, hii, hello, hey,
       namaste, welcome, cool, nice, perfect, super, fine, alright, right, got, it, will,
       do, ok_hand, plus, one, same, here, too, also, understood, received, recd, confirm,
       confirmed, checking, check, please, pls, kindly, karo, kar, diya, dijiye]

informational:
  # NOT noise and NOT a ticket. Weather callouts are deliberate operational comms — they are
  # 20-39% of top-level messages in lm-ams and carry roughly half of all attached media.
  # Flagged, never gated, and reported as a RANGE because the count is sensitive to where the
  # line is drawn.
  weather_terms:
    [rain, rains, rainy, rainfall, raining, barish, baarish, barsat, weather, flood, flooding,
     waterlogging, waterlogged, water level, jal bharav, paani bhar, monsoon, storm, cyclone,
     heavy shower, showers, thunderstorm, imd alert, orange alert, red alert]

  # ── ANNOUNCEMENTS — the same axis as weather, found by measuring ──────────────────────────
  # The brief seeded this classifier with weather keywords only, so it was weather-only. Run
  # against 155 adversarial messages it caught 10 of 28: the other 18 were not weather at all
  # but the same KIND of thing -- planned downtime, a public holiday, an SOP update, a road
  # diversion, a daily MIS. Deliberate operational comms that are not tickets.
  #
  # This list is deliberately CONSERVATIVE and phrase-based rather than word-based. The risk is
  # asymmetric: a real issue wrongly marked informational is HELD BACK and never becomes a
  # ticket, which is the failure that matters. A missed announcement merely raises a ticket
  # somebody closes. So only high-confidence announcement markers are here, and single common
  # words like "update" or "notice" are deliberately absent -- "any update ??" is an orphan
  # follow-up, not an announcement.
  announcement_terms:
    [planned downtime, scheduled maintenance, maintenance window, public holiday,
     bank holiday, holiday hai, band rahega, bandh rahega, road blocked, full diversion,
     route diversion, advisory, notice for all, please note that, dhyan de, dhyan den,
     sabhi ko inform, for your information only, fyi only, no action required,
     updated sop, process follow karna, daily mis, mis report]

  # ── AN ASK BEATS THE WEATHER ──────────────────────────────────────────────────────────────
  # Measured failure: "Dear losses team, I have so many losses at my hub please reverse - rain
  # has made it extremely difficult to route these parcels" was held back as a weather callout.
  # It is not. It is a partner asking for their losses to be reversed; the rain is the REASON,
  # offered as context. Two of these arrived in one afternoon and neither became a ticket.
  #
  # The old rule already knew it was unsure — an ops topic came first, so it marked the message
  # `borderline` — and then suppressed it anyway. Borderline has to mean something.
  #
  # So: when an operational topic is named BEFORE the weather word AND the message asks for
  # something, it is not informational at all. A weather callout does not ask for anything;
  # that is what makes it a callout. The asymmetry justifies it — a real issue wrongly held
  # back is never seen by anyone, while a missed announcement just raises a ticket somebody
  # closes in ten seconds.
  request_markers:
    [please, pls, kindly, request, requesting, need, chahiye, karo, kar do, dijiye, karwa do,
     can we, can you, could you, do the needful, arrange, reverse, resolve, release, approve,
     help, support, sort out, look into, revert]

  # An operational topic that is NOT weather. Used only to decide the STRICT bound: a message
  # is strictly informational when the FIRST topic keyword it mentions is a weather term.
  # The real message that motivated this leads with festival manpower absenteeism and mentions
  # rain second — counting it as a weather callout would overstate the share, and excluding it
  # would understate it, so it is reported as borderline and listed by id.
  competing_terms:
    [festival, manpower, absenteeism, strike, holiday, payout, payment, invoice, login, panel,
     vehicle, held, hardstop, shortage, loss, rto, onboarding, pilot, otp, app, tech, closure,
     line haul, linehaul, load not received, dc closure, negative payout]
