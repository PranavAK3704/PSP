# Render Blueprint — one Docker web service for the Valmo Partner Support Platform.
# DURABILITY: the free tier has NO persistent disk, so authored state (users, blueprints,
# KT queue/SOPs, framework, rubric/audits, ledger, traces, CPD) is mirrored to Turso (the
# same DB the loss data uses) via app/durable_state.py — it survives redeploys/restarts as
# long as TURSO_DATABASE_URL + TURSO_AUTH_TOKEN are set below. Secrets are set in the Render
# dashboard (sync: false → never stored in git).
services:
  - type: web
    name: valmo-psp
    env: docker
    plan: free                 # free tier — no card required
    # NOTE (free tier): instance sleeps after ~15 min idle (slow first request). The local
    # /data dir resets on redeploy, but durable_state restores authored content from Turso on
    # boot, so nothing is lost. (Seeds — losses brain, COD SOP, INITIAL_ADMIN — also re-seed.)
    dockerfilePath: ./Dockerfile
    # $PORT is injected by Render automatically (the Dockerfile CMD reads it).
    healthCheckPath: /api/health
    envVars:
      # Local cache dir; durable truth is Turso (see durable_state.py). Ephemeral on free tier.
      - key: PSP_STATE_DIR
        value: /data
      # Account data for the resolution engine: `localdb` reads the REAL loss-attribution
      # ledger (the same Turso tables the loss data already lives in) keyed on real
      # partner_id, instead of the three hand-written seed captains. Rollback is this one
      # value — set it to `demo` to go back to seed, or `prism` once a client token exists.
      - key: PSP_DATA_PROVIDER
        value: localdb
      # ── the deterministic pre-router ────────────────────────────────────────
      # THESE MUST BE HERE, not in scripts/load_env.sh. The Dockerfile CMD runs uvicorn
      # directly and never sources that script, so anything set there reaches a local shell
      # and nothing else. The gap was invisible: `router.mode()` falls back to `shadow` on an
      # unset value, so the deployed instance quietly ran with greetings OFF while the local
      # one had them on — a config difference that looks identical to working.
      #
      # `shadow` globally: the verdict is computed and traced, the LLM still answers. That is
      # what collects the one number the corpus cannot give us — 81.6% of tickets are WhatsApp
      # and the repo holds none of its message text, so absorption is unmeasurable offline.
      - key: PSP_PREROUTER
        value: shadow
      # Greetings are the exception and they are LIVE. A closed whitelist over a fixed phrase
      # list has nothing to learn from shadow mode (check_router holds it to zero false
      # positives across 77 phrasings), and every shadowed turn pays the measured Rs 4.54 to
      # answer with a model what a dictionary answers exactly.
      - key: PSP_PREROUTER_GREETING
        value: "on"
      # At-risk shipments: `derived` reads the real loss ledger. Declared rather than left to
      # the code default so a reader of this file can see which source is live — if it ever
      # drops to `seed` the monitor shows FICTIONAL shipments and looks identical to working.
      - key: PSP_RISK_SOURCE
        value: derived
      # ── Dashboard-set secrets (never committed) ──
      # ACTIVE provider is `claude` (backend/config/models.yaml), so ANTHROPIC_API_KEY is the
      # one the running app actually needs. Declared here so a blueprint sync can never
      # reconcile away a hand-added var — the VALUE is still dashboard-only (sync: false).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Legacy/alternative provider path — only read when models.yaml says provider: openai
      # (or LLM_PROVIDER=openai overrides it). Kept so the swap seam stays one env var wide.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
